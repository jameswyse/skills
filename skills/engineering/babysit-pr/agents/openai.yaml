interface:
  display_name: "PR Babysitter"
  short_description: "Watch PR review comments, CI, and merge conflicts"
  default_prompt: "Use $babysit-pr to monitor the current PR, address valid branch-related feedback, push fixes, and retry eligible flaky failures within the configured budget; keep watching until the PR closes or a blocker requires my help, and ask before posting review replies unless I have already authorised them."
