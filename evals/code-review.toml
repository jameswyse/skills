skill = "code-review"
include = [
  "engineering/SKILL.md",
  "delegation/SKILL.md",
  "engineering/references/design.md",
]

[[probe]]
id = "scope-dirty-tree-untracked"
kind = "decision"
prompt = '''
You have finished a change and are about to review it before reporting it complete. The user gave no ref to compare against. Nothing is committed on top of `main`. `git status --short` shows:

 M src/orders/intake.ts
 M src/orders/intake.test.ts
?? src/orders/intakeLimits.ts
?? scripts/backfill-limits.ts

What exactly makes up the review scope, and how do you capture it?
'''
expect = '''
Pass: the scope covers the tracked changes relative to HEAD (`git diff HEAD`, or a snapshot that includes staged and unstaged changes) and the complete contents of both untracked files.
Fail: leaves out the untracked files, captures only unstaged changes with a bare `git diff`, or reviews a branch diff against `main` that would miss the uncommitted work.
'''

[[probe]]
id = "scope-ambiguous-base"
kind = "decision"
prompt = '''
The user says "review this branch". The working tree is clean and the branch has six commits. `gh pr view` reports that no pull request exists for it. The repository has two remotes, and each has a HEAD ref: `refs/remotes/origin/HEAD` points at `origin/main` and `refs/remotes/upstream/HEAD` points at `upstream/develop`. The user named no ref.

What do you do next?
'''
expect = '''
Pass: asks the user for the ref or base to review against before reviewing, because no unambiguous base exists.
Fail: picks `origin/main` or `upstream/develop` and starts the review, even with a stated assumption.
'''

[[probe]]
id = "scope-empty-diff"
kind = "decision"
prompt = '''
The user says "review everything since `release-2026-11`". `git rev-parse release-2026-11` resolves to a commit. `git diff release-2026-11...HEAD` prints nothing, `git log release-2026-11..HEAD --oneline` prints nothing, and `git status --short` is empty.

What do you do next?
'''
expect = '''
Pass: reports that there are no changes to review and stops.
Fail: starts reviewers anyway, picks a different base, or reviews the repository as a whole.
'''

[[probe]]
id = "spec-none-available"
kind = "decision"
prompt = '''
The user says "review my branch against origin/main". The ref verifies and the working tree is clean. The branch has three commits: "refactor order intake", "tidy imports", and "rename helper". None mentions an issue. The user supplied no document, the repository has no `docs/` or `specs/` directory, and no pull request is being drafted.

Which review axes run, and what do you report about the others?
'''
expect = '''
Pass: Standards and Correctness run. The Spec axis is skipped and the review reports "no spec available" (or equivalent wording that no spec exists).
Fail: invents a spec from the commit messages or the diff and runs a Spec review, or drops Spec without saying so.
'''

[[probe]]
id = "spec-excludes-drafted-description"
kind = "decision"
prompt = '''
The user asked you to implement issue #212, "Retry failed uploads", and open a pull request. The change is finished and you are reviewing it before opening the pull request. You have already drafted the description, which says "Failed uploads are retried up to three times with backoff." The issue doesn't say how many retries it wants. You are about to write `spec.md` for the reviewers.

What goes into `spec.md`?
'''
expect = '''
Pass: the user's request and issue #212, looked up. The drafted title and description stay out of `spec.md`, so the reviewers don't treat the draft's claims as requirements.
Fail: adds the drafted description, or claims taken from it such as the three retries, to `spec.md`.
'''

[[probe]]
id = "round-one-reviewers"
kind = "plan"
prompt = '''
You're in a T3 Code thread reviewing your own finished change. The scope is already captured: a branch diff against `origin/main`, and issue #412 is the spec. The `codex` shell command is not installed. `orchestrator_capabilities` returned:

inheritedProviderInstanceId: claudeAgent
inheritedModel: claude-opus-5-5
providers:
- codex: canRunCrossProviderChildTask true; models gpt-6-sol, gpt-6.1-sol, gpt-6-astra, gpt-6.1-astra; options: reasoningEffort (low | medium | high)
- claudeAgent: canRunCrossProviderChildTask true; models claude-sonnet-5-5, claude-opus-5-5, claude-fable-5-2; options: effort (low | medium | high)
- cursor: canRunCrossProviderChildTask true; models grok-4.7; options: reasoning_effort (low | medium | high), fastMode (true | false)

List the reviewer calls for round one, without executing them. For each, give the tool, provider, model, role, mode, and options, and say how you issue them. Leave out the task prompt text.
'''
expect = '''
Pass: five `delegate_task` calls. Standards runs once, on codex gpt-6.1-sol. Spec runs on codex gpt-6.1-sol and on claudeAgent claude-fable-5-2. Correctness runs on codex gpt-6.1-astra and on claudeAgent claude-fable-5-2. Every call has role "review", mode "async", and effort high set explicitly through `target.options` (`reasoningEffort` for codex, `effort` for Claude). All calls are issued in the same step.
Fail: Standards on two models, Correctness on Sol, Astra on Standards or Spec, claude-opus-5-5, gpt-6-sol, or gpt-6-astra used as a reviewer, the Fable reviewer left out or run as a native subagent because it shares the session's provider, mode "wait" or calls issued one after another, or effort left unset.
'''

[[probe]]
id = "replace-unavailable-provider"
kind = "decision"
prompt = '''
You're in a T3 Code thread on claudeAgent with claude-opus-5-5, starting round one of a review of your own change. A spec exists. `orchestrator_capabilities` reports codex with `canRunCrossProviderChildTask: false`. claudeAgent can run child tasks and lists claude-fable-5-2. You also have a native subagent tool that can start a subagent with a fresh context.

Who reviews each axis in round one, and what do you say about it in the review?
'''
expect = '''
Pass: the three reviews that would have run on codex (Sol on Standards and Spec, Astra on Correctness) still run, each replaced by a native subagent on the session's model with no parent history. The Fable reviewers for Spec and Correctness still run. The review names the provider and model behind each reviewer and gives the reason for the replacement.
Fail: drops the codex reviews or the Standards axis, stops to ask the user, reviews every axis sequentially in the primary agent, or replaces reviewers without reporting it.
'''

[[probe]]
id = "verifier-single-call"
kind = "decision"
prompt = '''
You're in a T3 Code thread on claudeAgent with claude-opus-5-5. Round one's reviewers have all reported, with eleven candidate findings between them. Three are Correctness candidates their reviewers marked P1, two from GPT-6.1-Astra and one from Claude Fable 5.2. The other eight are Standards or Spec candidates, or Correctness candidates marked P2 or P3. `delegate_task` works, and codex lists gpt-6.1-sol and can run child tasks.

What is your next step?
'''
expect = '''
Pass: sends the three Correctness P1 candidates, and only those, in one `delegate_task` to the newest Sol on codex at high effort, asking it to reproduce or refute each against the checkout with read-only commands and to report evidence and a verdict (likelihood, harm, and fix complexity may also be requested). Its report is evidence, and the primary agent still verifies all eleven candidates itself.
Fail: sends all eleven candidates to the verifier, one call per finding, a Claude or Grok verifier, treating the verifier's verdicts as final, or going straight to presenting or fixing the candidates.
'''

[[probe]]
id = "verifier-none-qualify"
kind = "decision"
prompt = '''
You're in a T3 Code thread on claudeAgent with claude-opus-5-5. Round one's reviewers have all reported, with six candidate findings between them: four under Standards, one under Spec marked P1, and one under Correctness marked P2. `delegate_task` works, and codex lists gpt-6.1-sol and can run child tasks.

What is your next step?
'''
expect = '''
Pass: starts no verifier, because no Correctness candidate is marked P0 or P1, and verifies each of the six candidates itself.
Fail: sends any candidate to a verifier, or presents or fixes the candidates without verifying them itself.
'''

[[probe]]
id = "verifier-not-own-finding"
kind = "decision"
prompt = '''
You're in a T3 Code thread on codex with gpt-6.1-sol. The codex catalogue lists no Astra model, so the round-one Correctness reviewers were GPT-6.1-Sol, as the replacement, and Claude Opus 5.5. Both have reported. Two Correctness candidates are marked P1: Sol reported the first and Opus reported the second. `delegate_task` works. codex lists gpt-6.1-sol, claudeAgent lists claude-opus-5-5 and claude-fable-5-2, and both can run child tasks.

Who verifies each candidate, and in how many calls?
'''
expect = '''
Pass: two `delegate_task` calls. Opus on claudeAgent verifies the candidate Sol reported, because a verifier never checks a candidate it reported. Sol on codex verifies the candidate Opus reported.
Fail: Sol verifies the candidate Sol reported, both go to one verifier, Fable or Grok verifies either, or no verifier runs.
'''

[[probe]]
id = "codex-cli-model"
kind = "plan"
prompt = '''
You're in a T3 Code thread on claudeAgent with claude-opus-5-5, starting round one of a review of your own committed change against `origin/main`. The `codex` shell command is installed. `orchestrator_capabilities` lists codex models gpt-6-sol, gpt-6.1-sol, gpt-6-astra and gpt-6.1-astra, and this machine's `~/.codex/config.toml` sets `model = "gpt-6-sol"`.

Write the shell command for the Codex CLI reviewer.
'''
expect = '''
Pass: a `codex review --base origin/main` command that overrides the model to gpt-6.1-astra with `-c 'model="gpt-6.1-astra"'`, sets `model_reasoning_effort` to high and `service_tier` to priority, keeps the read-only sandbox, `--disable multi_agent` and the developer instructions, and writes its output and log to files in the packet directory.
Fail: leaves the model to the machine's config, picks gpt-6-astra, a Sol model, or a model the catalogue doesn't list, or leaves out the effort or the service tier.
'''

[[probe]]
id = "later-round-reviewers"
kind = "decision"
prompt = '''
Round one of your review ended with two actionable findings: a P1 under Correctness and a P2 under Standards. The task authorised fixing findings. You fixed both and reran the affected checks. The environment is unchanged from round one: T3 tools work, codex and claudeAgent can both run child tasks, cursor lists Grok, and the `codex` command is installed.

What review happens now, and who runs it?
'''
expect = '''
Pass: a narrower second round on the fixes. One reviewer per applicable axis, on Sol only, receives the fix diff, the full current diff for context, and the earlier findings with their outcomes. No second-family (Fable or Opus) reviewer, no Codex CLI review, no verifier, and no contrarian.
Fail: no further review, or a repeat of the full round-one set of reviewers.
'''

[[probe]]
id = "p3-only-stops"
kind = "decision"
prompt = '''
Round one of your review produced two actionable findings, both P3: a misleading local variable name and an unsorted import list. The task authorised fixing findings, and you fixed both.

What happens next?
'''
expect = '''
Pass: the review stops. `P3` fixes need no further round. It presents the result and ends with the run report.
Fail: runs another review round on the fixes.
'''

[[probe]]
id = "later-round-reviewer-scope"
kind = "decision"
prompt = '''
Round one of your review ended with an actionable P1 under Correctness, which you fixed. You are briefing the round-two Correctness reviewer, which gets `fixes.diff`, the full `scope.diff`, and the earlier findings with their outcomes.

What do you ask it to check, and what may it report?
'''
expect = '''
Pass: asks it to check that each fix resolves its finding and to report defects in `fixes.diff`. Outside `fixes.diff` it reports only what would be P0 or P1. It raises an accepted risk or rejected finding again only with new evidence.
Fail: asks for a fresh review of the whole `scope.diff` at every priority, or sets no limit on what it may report outside `fixes.diff`.
'''

[[probe]]
id = "round-two-p2-only-stops"
kind = "decision"
prompt = '''
You are in round two of reviewing your own change. Round one had a P1, which you fixed. The round-two reviewers reported two findings, and you verified both as actionable P2s: under Correctness, a test that still passes when the behaviour it covers breaks, and under Standards, a duplicated helper. Nothing in round two was P0 or P1. The task authorised fixing findings.

What do you do?
'''
expect = '''
Pass: fixes both P2s, reruns the checks the fixes affect, runs no third round, and reports that those fixes had no independent review.
Fail: runs a third round on the fixes, leaves the P2s unfixed, or ends without saying the fixes had no independent review.
'''

[[probe]]
id = "delegated-fix-checks"
kind = "decision"
prompt = '''
Earlier in this task you started a subagent with this brief, among other instructions: "Each commit must pass typecheck, lint and format:check. Run the affected test files as you go, and the full suite once at the end (0 skipped). Use --fixup commits on the commit that introduced the code." It finished a 14-commit change. Round one of your review found findings F1 to F20, mostly weakened assertions in test files, including P1s, so round two will run after the fixes. They are written up in /tmp/review/round1.md. The task authorised fixing findings.

Write the message you send to resume the same subagent so it fixes them.
'''
expect = '''
Pass: tells it to run only the checks the fixes affect, such as the changed test files and lint on HEAD, and to skip the check of every commit and the full suite. Those run once, after the last round's fixes.
Fail: repeats or keeps the original brief's checks, such as typecheck, lint and format:check on every commit or the full suite, for this round.
'''

[[probe]]
id = "round-two-production-p2"
kind = "decision"
prompt = '''
You are in round two of reviewing your own change to a deployed service, and an issue is its spec. Round one had a P1, which you fixed. Every round-two report is in, and you verified three actionable P2s and nothing higher. Under Correctness, the order service saves a wrong total for an input only unusual use reaches. Under Standards, there is a duplicated helper. Under Spec, an error response that only unusual use reaches omits a field the issue asks for. The task authorised fixing findings, and you fixed all three.

What happens next, and who reviews what?
'''
expect = '''
Pass: runs a third round with one Correctness reviewer, on Sol, and no Standards or Spec reviewer. It checks only that the total fix resolves its finding and breaks nothing, and reports anything else, including elsewhere in `fixes.diff`, only when it would be P0 or P1. Says the Standards and Spec fixes had no independent review.
Fail: stops after round two, sends Standards or Spec to a reviewer, asks the reviewer for defects at every priority across `fixes.diff`, or claims the Standards and Spec fixes were reviewed.
'''

[[probe]]
id = "round-two-spec-p2-stops"
kind = "decision"
prompt = '''
You are in round two of reviewing your own change to a deployed service. Round one had a P1, which you fixed. The round-two reviewers reported one finding, and you verified it as an actionable P2 under Spec: an error response that only unusual use reaches omits a field the issue asks for. You fixed it in production code. Standards and Correctness were clean.

What happens next?
'''
expect = '''
Pass: runs no third round, because only a Correctness P2 whose fix changes production behaviour, or a P0 or P1, triggers one. Reports that the fix had no independent review.
Fail: runs a third round, or ends without saying the fix had no independent review.
'''

[[probe]]
id = "round-three-p1-axes"
kind = "decision"
prompt = '''
You are in round two of reviewing your own change, and an issue is its spec. You verified three actionable findings: a P1 under Correctness, where ordinary checkout charges shipping twice, and two P2s under Standards. You fixed all three and reran the affected checks. Nothing else is open.

Which reviewers run in round three, if it runs, and what do you report about the fixes at the end?
'''
expect = '''
Pass: round three runs with a Spec reviewer and a Correctness reviewer and no Standards reviewer. Reports that the two Standards fixes had no independent review.
Fail: runs no third round, includes a Standards reviewer, leaves out Spec or Correctness, or claims the Standards fixes were reviewed.
'''

[[probe]]
id = "round-three-standards-p1-fix"
kind = "decision"
prompt = '''
You are in round two of reviewing your own change, and an issue is its spec. You verified one actionable finding: a P1 under Standards, where an ordinary order save discards its typed failure and reports success, against the repository's rule that typed failures reach the caller. You fixed it and reran the affected checks. Spec and Correctness were clean.

Which reviewers run in round three, if it runs, and who checks the Standards fix?
'''
expect = '''
Pass: round three runs with a Spec reviewer and a Correctness reviewer and no Standards reviewer. The Correctness reviewer is asked to check that the Standards fix resolves its finding.
Fail: runs no third round, adds a Standards reviewer, leaves out Spec or Correctness, or leaves the Standards fix unchecked.
'''

[[probe]]
id = "third-round-cap"
kind = "decision"
prompt = '''
You are in the third round of reviewing your own change. Rounds one and two each led to fixes. The round-three Correctness reviewer reports a defect, and you verify it as a real P1. The task authorised fixing findings.

What do you do?
'''
expect = '''
Pass: fixes the P1, runs no fourth round, and reports that this fix had no independent review.
Fail: starts a fourth round, or leaves the P1 unfixed for the user.
'''

[[probe]]
id = "accepted-risk-rare-trigger"
kind = "decision"
prompt = '''
A Correctness reviewer reports, and you verify, that double-clicking "Export" within about 30 ms starts two identical CSV downloads. The smallest fix is an in-flight request tracker shared by the button, the export hook, and the download service. The task authorised fixing findings.

How do you handle this finding?
'''
expect = '''
Pass: reports it as an accepted risk, with the reasoning about likelihood, harm, and fix complexity, and does not fix it.
Fail: builds the in-flight tracker, lists it as an actionable finding to fix, or leaves it out of the review.
'''

[[probe]]
id = "spec-finding-disproportionate"
kind = "decision"
prompt = '''
Issue #77 is the spec for your change, and one of its requirements reads "the export includes archived projects". Your change exports active projects only. Including archived ones needs a new query path over cold-storage tables and a reindex, which is several times the size of the rest of the change. The task authorised fixing findings, and two other findings are waiting to be fixed.

How do you handle the archived-projects gap?
'''
expect = '''
Pass: reports it under Spec as a decision for the user, not as an accepted risk, and carries on fixing the other findings while it waits.
Fail: files it as an accepted risk, drops it, decides alone to leave it out without flagging a decision, or builds the cold-storage query path without asking.
'''

[[probe]]
id = "priority-labels"
kind = "decision"
prompt = '''
You have verified four actionable findings:

A. Any signed-in user can read another tenant's invoices by changing the `tenantId` query parameter on the list endpoint.
B. Page two of the customer list repeats the last row of page one, for every user.
C. A helper duplicates twelve lines that already exist in a sibling module.
D. A local variable is named `data2`.

Give each one its priority label.
'''
expect = '''
Pass: A is P0, B is P1, C is P2, D is P3.
Fail: any other labelling scheme (such as critical/high/medium/low or blocker/should/nit), or a different mapping.
'''

[[probe]]
id = "item-ids-and-sections"
kind = "decision"
prompt = '''
Verification of your review left four items:

- A Parallel Path smell, reported by GPT-6.1-Sol, actionable, P2.
- Padded input passing a minimum-length check, reported by GPT-6.1-Sol and Claude Fable 5.2, actionable, P1.
- A requirement from the issue whose fix is disproportionate, left for the user.
- A rare duplicate download, reported by the Codex CLI, which you weighed and won't fix.

Show the headings and the first line of each item as you would present them.
'''
expect = '''
Pass: separate `## Standards`, `## Spec`, `## Correctness`, and `## Accepted risks` headings. The two actionable items carry `F` IDs with the priority in brackets and their reviewers, such as `F1 [P2] GPT-6.1-Sol` and `F2 [P1] GPT-6.1-Sol, Claude Fable 5.2`. The user decision is `Q1` and the accepted risk is `R1`. Findings stay under their own axis.
Fail: one list ranked across axes, a different ID scheme, or item lines without the reviewers.
'''

[[probe]]
id = "contrarian-selection"
kind = "decision"
prompt = '''
You're in a T3 Code thread on claudeAgent with claude-opus-5-5. cursor lists grok-4.7, codex lists gpt-6.1-sol and gpt-6.1-astra, claudeAgent lists claude-opus-5-5 and claude-fable-5-2, and all three can run child tasks. After verifying and weighing a review's candidates you have:

1. A rejected candidate, "the tenant filter is missing on the delete endpoint", which GPT-6.1-Astra reported. You rejected it because you believe middleware always injects the filter. If it were real it would be P0.
2. A rejected candidate about a function name. If it were real it would be P3.
3. An accepted risk, which GPT-6.1-Sol reported: a crash between two writes can leave an orphaned upload record that later deletes the wrong file. You judged it very unlikely.
4. An accepted risk: a tooltip flickers on rapid hover.

Which of these get challenged, by whom, and in how many calls?
'''
expect = '''
Pass: Grok on cursor gets items 1 and 3 in one call. Item 3 also goes to Astra on codex. Item 1 also goes to Fable on claudeAgent instead of Astra, because Astra reported it. Items 2 and 4 are not sent.
Fail: sends all four or none, asks Astra to argue item 1, leaves item 1 or item 3 with Grok alone, uses Sol or Opus as a contrarian, or makes a separate Grok call for each item.
'''

[[probe]]
id = "another-author-personal-rules"
kind = "decision"
prompt = '''
The user asks you to review a colleague's pull request in their team's repository and draft a review comment. The diff adds explanatory `//` comments above several new functions, and each matches what its function does. The repository's rule files say nothing about comments, and the neighbouring files carry comments in the same style.

Do the added comments go into the review as findings?
'''
expect = '''
Pass: no. The user's personal rules, including the ban on code comments, don't apply to another author's change. The standards come from the repository's rule files and the conventions in the touched files and their neighbours. Only a comment that contradicts the code would be reportable.
Fail: reports the comments as violations or asks for them to be removed.
'''

[[probe]]
id = "smell-symptom-guard"
kind = "decision"
prompt = '''
You're reviewing the Standards axis of your own change. One hunk in `ui/InvoiceSummary.tsx` adds:

    if (!invoice.totals) return null;

The commit message says it "fixes the crash when totals are missing". `Invoice.totals` is typed as non-optional and is filled by `toInvoice()` in `api/mappers.ts`, which the diff doesn't touch. You have traced the crash: `toInvoice()` leaves `totals` undefined when the API response omits the field.

What, if anything, do you report for this hunk?
'''
expect = '''
Pass: a finding that names the smell "Symptom Guard", quotes or cites the hunk, states the concrete cost (the invalid state is silenced while the type still claims `totals` is present), and gives the smallest response, which is preventing the state where it enters in the mapper or type.
Fail: reports nothing, approves the guard, or describes the problem without naming Symptom Guard.
'''

[[probe]]
id = "test-smell-tautological-oracle"
kind = "decision"
prompt = '''
You're reviewing a change whose scope includes this new test:

    it("totals the cart", () => {
      const items = [{ price: 19.99, qty: 3 }, { price: 5, qty: 2 }];
      const expected = items.reduce((sum, i) => sum + i.price * i.qty, 0).toFixed(2);
      expect(formatTotal(items)).toBe(expected);
    });

`formatTotal` is implemented with the same `reduce` and `toFixed(2)`.

What, if anything, do you report for this test?
'''
expect = '''
Pass: a finding that names the test smell "Tautological oracle", because the expected value comes from the implementation's own algorithm, and asks for an independent expected value such as the literal "69.97".
Fail: reports nothing, or describes the problem without naming the Tautological oracle smell.
'''

[[probe]]
id = "test-smell-test-only-hook"
kind = "decision"
prompt = '''
You're reviewing a change whose scope adds this to `src/session/cache.ts`:

    export function _resetCacheForTests() { cache.clear(); }

and this test in `src/session/cache.test.ts`:

    beforeEach(() => _resetCacheForTests());
    it("returns the stored session", async () => {
      await saveSession(alice);
      expect(await loadSession(alice.id)).toEqual(alice);
    });

Nothing outside tests calls `_resetCacheForTests`. `cache` is a module-level `Map`.

What, if anything, do you report?
'''
expect = '''
Pass: a finding that names the test smell "Test-only hook", because production code exists only so tests can reach in, and asks to remove the export and isolate tests through the interface, such as by constructing a fresh cache or session store per test.
Fail: reports nothing, or describes the problem without naming the Test-only hook smell.
'''

[[probe]]
id = "test-smell-duplicate-guard"
kind = "decision"
prompt = '''
You're reviewing a change whose scope adds this test to `cart/total.test.ts`:

    it("adds tax to the total", () => {
      expect(cartTotal([book], { tax: 0.1 })).toBe(11);
    });

`checkout/checkout.test.ts` already has `it("totals with tax", () => expect(cartTotal([book], { tax: 0.1 })).toBe(11))`, and nothing else differs between them.

What, if anything, do you report for the new test?
'''
expect = '''
Pass: a finding that names the test smell "Duplicate guard", because the existing test already protects the same behaviour through the same seam, and asks to drop one of them.
Fail: reports nothing, or describes the problem without naming the Duplicate guard smell.
'''

[[probe]]
id = "naming-suffix-and-reexport"
kind = "decision"
prompt = '''
You're reviewing a change to an application (not a published package). It adds two files:

- `src/quotes/quotePolicy.ts`, which exports `isQuoteEligible(quote)` and its thresholds.
- `src/quotes/index.ts`, whose only line is `export * from "./quotePolicy";`. Callers import from `src/quotes`.

"Policy" isn't a term the business or the codebase uses elsewhere.

What, if anything, do you report about these two files?
'''
expect = '''
Pass: flags both. `quotePolicy.ts` uses `Policy` as a generic suffix and should be named after its specific concept, such as `quoteEligibility.ts`. The re-export-only `index.ts` should go, with callers importing directly from the module that owns the code.
Fail: accepts both files, or flags only one of them.
'''

[[probe]]
id = "run-report-table"
kind = "plan"
prompt = '''
Your review ran two rounds. Reported and verified counts were:

- Round 1, GPT-6.1-Sol: Standards 3 reported and 1 verified, Spec 2 and 0, Correctness 4 and 3.
- Round 1, Claude Fable 5.2: Spec 1 and 0, Correctness 4 and 2. It did not review Standards.
- Round 1, Codex CLI: Standards 0 and 0, Spec 0 and 0, Correctness 2 and 1.
- Round 2, GPT-6.1-Sol: Correctness 1 and 0. It reviewed no other axis.

The verifier, GPT-6.1-Sol, confirmed 6 candidates and refuted 9. The contrarian, Grok 4.7, reversed one rejection. Actionable findings: Standards 1, Spec 0, Correctness 3. The worst was a P1, an unlocked price being saved. One accepted risk.

Write the section that ends the review.
'''
expect = '''
Pass: a Markdown table with the columns Round, Reviewer, Standards, Spec, and Correctness, with one row per reviewer per round (four rows), cells written as reported / verified such as `3 / 1`, and `-` for an axis a reviewer didn't review. One line of outcomes follows it: the verifier's confirmed and refuted counts, the contrarian's result, actionable counts per axis, the worst priority, and the accepted-risk count.
Fail: prose only, one row per finding, extra columns such as duration or tokens, or verified counts left out.
'''

[[probe]]
id = "calibration-classification"
kind = "decision"
prompt = '''
You're calibrating your reviews against bot comments on last month's merged pull requests. Two inline Copilot comments are in front of you:

1. It correctly points out that two workers polling in the same millisecond can both claim one job, which rebuilds an email digest twice. The rebuild is idempotent, and preventing the double claim would need a claim lock.
2. "Consider adding a JSDoc comment here." This is the fifth comment of this kind in the month.

How do you classify each, and what follows from each classification?
'''
expect = '''
Pass: the first is an accepted risk, real but something the review's weighing would leave unfixed, so it isn't a miss and changes neither the miss rate nor the checklist. The second is noise, and because it recurs the recommendation is to tune the bot, such as through Copilot's repository instructions, instead of changing the review.
Fail: counts the first as a miss, or changes the review or its checklist in response to the second.
'''

[[probe]]
id = "final-pass"
kind = "decision"
prompt = '''
Every candidate finding from your review's reviewers has been verified and weighed, and the contrarian has replied. Nothing is waiting on another agent.

What do you do between now and sending the review?
'''
expect = '''
Pass: makes one final pass of its own over the complete scope for high-risk correctness or security issues the reviewers missed, then presents the findings by axis and ends with the run report.
Fail: presents the findings without a pass of its own over the scope.
'''

[[live]]
id = "live-review-planted-defects"
fixture = "invites-branch"
prompt = '''
Review the `feature/invites` branch against `main` and report the review. Subagents, delegation tools, and the `codex` command are unavailable in this environment, and nothing may be posted or fixed.
'''
expect = '''
Score: count how many of these five planted problems the review reports as findings.
1. The membership and pending-invite checks in `inviteMember` compare the raw email, so a padded or differently cased address bypasses `already-member` or `already-invited`.
2. `revokeInvite` never checks that the invite belongs to the team the actor administers, so an admin of one team can revoke another team's invite.
3. The limit of 5 pending invites per team (`invite-limit`) is not implemented.
4. `acceptInvite` throws for an expired invite instead of returning `{ ok: false, reason: "expired" }`, against the spec and the repository's AGENTS.md rule.
5. The expiry test derives its boundary from the implementation's `INVITE_LIFETIME_MS` constant, or asserts the throw, instead of the spec's 7 days and `expired` result.
Pass: the score is at least 4, the findings sit under separate Standards, Spec, and Correctness headings with IDs such as F1 and priorities such as P1, the review ends with a run report or a statement of how the review was run, and the agent changed no files.
Fail: a score of 3 or less; findings merged into one list without the three axes; any change to the repository.
'''
