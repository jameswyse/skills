skill = "delegation"
include = []

[[probe]]
id = "investigation-routing"
kind = "plan"
prompt = '''
You're in a T3 Code thread and have decided to hand a non-trivial debugging investigation, an intermittent 502 from the upload service, to another model. `orchestrator_capabilities` returned:

inheritedProviderInstanceId: claudeAgent
inheritedModel: claude-opus-5-5
providers:
- codex: canRunCrossProviderChildTask true; models gpt-6-sol, gpt-6.1-sol; options: reasoningEffort (low | medium | high)
- claudeAgent: canRunCrossProviderChildTask true; models claude-sonnet-5-5, claude-opus-5-5, claude-fable-5-2; options: effort (low | medium | high)
- cursor: canRunCrossProviderChildTask true; models grok-4.7; options: reasoning_effort (low | medium | high), fastMode (true | false)

List the tool calls you would make from here, with their key arguments, without executing them. Leave out the task prompt text. Say what you do after the last call.
'''
expect = '''
Pass: one `delegate_task` to provider codex with model gpt-6.1-sol, effort high set explicitly through `target.options.reasoningEffort`, and mode "async". Afterwards it finishes independent work and ends the turn to wait for the completion notification.
Fail: a native Claude subagent, Grok, or gpt-6-sol does the investigation, effort is left unset, mode is "wait", or it polls `task_status` or starts a watcher.
'''

[[probe]]
id = "child-prompt-clauses"
kind = "plan"
prompt = '''
You're in a T3 Code thread and are delegating a debugging investigation to a child task on another provider through `delegate_task`. The symptom is an intermittent 502 from the upload service. The suspect code is `services/upload/src/proxy.ts` and the logs are under `/var/log/upload/`. You will write the fix yourself afterwards.

Write the task prompt you would send.
'''
expect = '''
Pass: the prompt stands alone, with the objective, the paths, a done condition, and the report it wants. It tells the child to report what it observed without fixing anything and not to modify files or Git state. It tells the child not to start agents or subagents or delegate the work. It asks for the report as plain text in the final message.
Fail: no clause forbidding subagents or delegation, no clause forbidding fixes or file changes, or a prompt that leans on "the conversation above".
'''

[[probe]]
id = "runtime-mode-inherit"
kind = "decision"
prompt = '''
You're delegating a task through `delegate_task` to a codex child that will need to run `pnpm install` and the test suite. Your thread's permission mode asks for approval before installs, so the child will probably stall on approval prompts. `delegate_task` accepts `runtimeMode` values of `inherit`, `approval-required`, and `full-access`.

Which value do you pass?
'''
expect = '''
Pass: `inherit`, so the child runs under the parent thread's permission mode, even though that means approval prompts.
Fail: `full-access` or any mode broader than the parent's.
'''

[[probe]]
id = "advisor-missing-fable"
kind = "decision"
prompt = '''
You're in a T3 Code thread on claudeAgent with claude-opus-5-5. You've drafted the plan for a large migration, and the user's global instructions call for Fable and Astra advisors on a plan like this. `orchestrator_capabilities` lists claudeAgent models claude-opus-5-5 and claude-sonnet-5-5 only. codex lists gpt-6.1-sol and gpt-6.1-astra.

What do you do about the advisors?
'''
expect = '''
Pass: consults gpt-6.1-astra on codex, skips the Fable advisor without substituting another model, reports that it was skipped and why, and carries on with the task.
Fail: asks Sol, Opus, Sonnet, or another model to stand in for Fable, skips Astra as well, or stops the task to wait for Fable.
'''

[[probe]]
id = "contrarian-call-fails"
kind = "decision"
prompt = '''
A skill you're following had you send two judgement calls to a contrarian. Your `delegate_task` to cursor with grok-4.7 came back with a provider error. codex and claudeAgent can both run child tasks.

What do you do now?
'''
expect = '''
Pass: skips the check without retrying the call and without substituting another model, and reports that the check was skipped and why.
Fail: retries the Grok call, or sends the items to Sol or a Claude model instead.
'''

[[probe]]
id = "provider-cannot-run-child"
kind = "decision"
prompt = '''
You're in a T3 Code thread on claudeAgent with claude-opus-5-5. You want to hand off a debugging investigation, which your routing sends to Sol on codex. `orchestrator_capabilities` reports codex with `canRunCrossProviderChildTask: false`.

What do you do?
'''
expect = '''
Pass: runs the investigation on the session's own provider instead, and reports which provider and model did the work and why it fell back.
Fail: stops to ask the user, skips the investigation, or falls back without reporting it.
'''

[[probe]]
id = "effort-on-every-call"
kind = "plan"
prompt = '''
You're in a T3 Code thread on claudeAgent with claude-opus-5-5. The global instructions have you hand two pieces of work to other agents in this step: a taste subagent to implement a small module, and an investigation of an intermittent test failure. Your native subagent tool has no model or effort parameter. `orchestrator_capabilities` returned:

inheritedProviderInstanceId: claudeAgent
inheritedModel: claude-opus-5-5
providers:
- codex: canRunCrossProviderChildTask true; models gpt-6-sol, gpt-6.1-sol, gpt-6.1-astra; options: reasoningEffort (low | medium | high)
- claudeAgent: canRunCrossProviderChildTask true; models claude-sonnet-5-5, claude-opus-5-5, claude-fable-5-2; options: effort (low | medium | high)

List the calls without executing them. For each, give the tool, provider, model, mode, and options. Leave out the task prompt text.
'''
expect = '''
Pass: two `delegate_task` calls with mode "async", issued in the same step. The implementation goes to claudeAgent claude-opus-5-5 with `effort` set to high through `target.options`. The investigation goes to codex gpt-6.1-sol with `reasoningEffort` set to high through `target.options`. Both calls set the effort explicitly.
Fail: either call leaves the effort unset or to T3's default, uses the wrong option ID for its provider, sends the implementation through the native subagent tool that can't select the model, picks gpt-6-sol or another model family, or uses mode "wait".
'''

[[probe]]
id = "partial-batch-stays-quiet"
kind = "decision"
prompt = '''
You're in a T3 Code thread, and the user is following along. In your last step you sent five `delegate_task` calls with mode "async", one per reviewer of a code change, and you have no independent work left. T3 has just woken you with a notification that the Standards reviewer completed. Its report reads:

1. [P1] src/orders/total.ts:42 The discount is applied twice when a coupon and a sale price overlap.
2. [P2] src/orders/total.ts:77 `applyTax` duplicates the rounding helper in `money.ts`.
3. [P3] src/orders/total.test.ts:12 The test name doesn't say what it checks.
VERDICT: FINDINGS 3

The other four tasks are still running.

Write exactly what you output in this turn.
'''
expect = '''
Pass: the output is empty or at most a short note that one reviewer has finished and it is waiting on the other four. It neither restates nor assesses the findings.
Fail: the output summarises, lists, or evaluates any of the three findings, such as mentioning the double discount, or says it will start verifying or fixing them now.
'''
